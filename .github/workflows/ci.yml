name: CI

on:
  push:
    branches: ["main", "phase-**", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q __init__.py jevperf dashboard tests
      - name: Check dashboard JavaScript
        run: node --check dashboard/dist/index.js
      - name: Unit tests
        run: python -m unittest discover -s tests -v
