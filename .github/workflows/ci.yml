name: CI

on:
  push:
    branches: ["main", "phase-**", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ruff correctness lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.15.20"
          args: "check --select E9,F"
      - name: Compile Python
        run: python -m compileall -q __init__.py jevperf dashboard tests
      - name: Check dashboard JavaScript
        run: node --check dashboard/dist/index.js
      - name: Public repository scan
        run: python scripts/public_repo_scan.py .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
